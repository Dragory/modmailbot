name: plugin tests
on:
  pull_request:
    paths:
      - "plugins/**"
      - ".github/workflows/plugin-test.yml"
  push:
    branches: [master]
    paths:
      - "plugins/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:plugin
